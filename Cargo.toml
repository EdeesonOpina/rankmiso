[workspace]
resolver = "2"
members = [
  "crates/seo-core",
  "crates/seo-rules",
  "crates/seo-scoring",
  "crates/seo-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1"
url = "2"
wasm-bindgen = "=0.2.100"
