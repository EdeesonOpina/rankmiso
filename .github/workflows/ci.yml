name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.100 --locked
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:wasm
      - run: pnpm --filter @rankmiso/report-formats test
      - run: pnpm --filter @rankmiso/extension test
      - run: pnpm --filter @rankmiso/extension typecheck
      - run: pnpm --filter @rankmiso/extension lint
      - run: pnpm --filter @rankmiso/extension exec prettier --check "src/**/*.{ts,vue,css}" "entrypoints/**/*.{ts,vue,html}" "wxt.config.ts" "tests/**/*.ts"
      - run: pnpm --filter @rankmiso/extension build
      - run: pnpm --filter @rankmiso/extension build:firefox
      - run: pnpm --filter @rankmiso/extension build:edge
